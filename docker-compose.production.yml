name: wayfair-ai-ops

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    restart: unless-stopped
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256mb
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    restart: unless-stopped
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET must be set}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        attempts=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 60 ]; then
            exit 1
          fi
          sleep 2
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc version enable "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
    restart: "no"
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true

  web:
    image: wayfair-ai-ops-web:${APP_IMAGE_TAG:-local}
    build:
      context: .
      target: runner
    env_file:
      - .env.production
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3000"
    mem_limit: 1536m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  scheduler:
    image: wayfair-ai-ops-scheduler:${APP_IMAGE_TAG:-local}
    build:
      context: .
      target: scheduler
    env_file:
      - .env.production
    restart: unless-stopped
    profiles:
      - sync
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/digitalocean/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true

  migrate:
    image: wayfair-ai-ops-migrator:${APP_IMAGE_TAG:-local}
    build:
      context: .
      target: migrator
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
